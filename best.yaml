nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25,1024]
  s: [0.50, 0.50,1024]
  m: [0.50, 1.00,512]
  l: [1.00, 1.00,512]
  x: [1.00, 1.50,512]

# P4/P5双层融合架构
backbone:
  # ========== RGB路径 (层0-10) - 完整骨干网到P5 ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv,[128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (RGB_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8 (RGB_P3)
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2,[512, True]]            # 6 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, RPM, [1024]]                # 10 (RGB_P5)

  # ========== X路径 (层11-21) - 完整骨干网到P5 ==========
  - [-1, 1, Conv,[64, 3, 2], 'X']        # 11-P1/2 X路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2,[256, False, 0.25]]     # 13 (X_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8 (X_P3)
  - [-1, 2, C3k2,[512, False, 0.25]]     # 15
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  - [-1, 1, Conv,[1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, RPM, [1024]]                # 21 (X_P5)

  # ========== P4和P5层级融合 ==========
  # P4级融合
  - [[6, 17], 1, Concat, [1]]             # 22 P4融合: RGB_P4(6) + X_P4(17)
  - [-1, 2, C3k2, [1024, True]]           # 23 (Fused_P4)
  - [-1, 1, SCAA,[null, 8, 4]]          # 24 增强 Fused_P4

  # P5级融合
  - [[10, 21], 1, Concat, [1]]            # 25 P5融合: RGB_P5(10) + X_P5(21)
  - [-1, 2, C3k2, [1024, True]]           # 26
  - [-1, 1, RPM, [1024]]                # 27 (Fused_P5)
  - [-1, 1, SCAA,[null, 8, 4]]          # 28 增强 Fused_P5

# SOEP增强颈部 + 标准检测头
head:
  # 自顶向下路径 (FPN)
  - [28, 1, nn.Upsample, [None, 2, "nearest"]]  # 29 Fused_P5(现28层)上采样
  - [[-1, 24], 1, Concat, [1]]                  # 30 连接增强的Fused_P4(现24层)
  - [-1, 2, C3k2, [512, False]]                 # 31

  # === FSDA部分 ===
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 32 上采样到P3尺度
  - [2, 1, SPDConv, [256]]                      # 33 RGB_P2(2)经过SPDConv处理
  - [[-1, -2, 4], 1, Concat, [1]]               # 34 三路融合: SPDConv(33) + FPN(32) + RGB_P3(4)
  - [-1, 1, CSPOmniKernel, []]                  # 35 多尺度核融合+频域增强
  - [-1, 2, C3k2, [256, False]]                 # 36 (增强的P3/8-small)

  # 自底向上路径 (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                  # 37
  - [[-1, 31], 1, Concat, [1]]                  # 38 连接P4(现31层)
  - [-1, 2, C3k2,[512, False]]                 # 39 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 40
  - [[-1, 28], 1, Concat, [1]]                  # 41 连接增强的Fused_P5(现28层)
  - [-1, 2, C3k2,[1024, True]]                 # 42 (P5/32-large)

  - [[36, 39, 42], 1, Detect, [nc]]             # 43 Detect(增强的P3, P4, P5)